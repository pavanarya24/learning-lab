name: Batch 6 screenshots (one-off)
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download arXiv screenshots
        run: |
          set -e
          mkdir -p images
          to_png() {
            if command -v convert >/dev/null 2>&1; then convert "$1" "$2";
            elif command -v magick >/dev/null 2>&1; then magick "$1" "$2";
            elif command -v ffmpeg >/dev/null 2>&1; then ffmpeg -y -v error -i "$1" "$2";
            else echo "no image converter available"; exit 1; fi
          }
          grab() {
            curl -fsSL --retry 3 -o "/tmp/$1.jpg" "https://v1.screenshot.11ty.dev/https%3A%2F%2Farxiv.org%2Fabs%2F$2/opengraph/"
            to_png "/tmp/$1.jpg" "images/$1.png"
          }
          grab arxiv-ofi-foundation 2610.28753
          grab arxiv-causal-impact 2610.12537
          grab arxiv-eod-reversal 2611.09286
          grab arxiv-irreversibility 2610.16151
          file images/arxiv-ofi-foundation.png images/arxiv-causal-impact.png images/arxiv-eod-reversal.png images/arxiv-irreversibility.png
          for f in images/arxiv-ofi-foundation.png images/arxiv-causal-impact.png images/arxiv-eod-reversal.png images/arxiv-irreversibility.png; do
            file "$f" | grep -q "PNG image" || { echo "$f is not a PNG"; exit 1; }
            s=$(stat -c%s "$f"); [ "$s" -gt 10000 ] || { echo "$f is too small"; exit 1; }
          done
          ls -l images/arxiv-*.png
      - name: Commit screenshots and remove this workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/batch6-screenshots.yml
          git add images/arxiv-ofi-foundation.png images/arxiv-causal-impact.png images/arxiv-eod-reversal.png images/arxiv-irreversibility.png
          git diff --cached --quiet && { echo "nothing to commit"; exit 1; }
          git commit -m "Learning Lab — Batch 6 screenshots"
          git push
